name: SEP-51 corpus drift

# Reference-parity guard. Re-runs tools/sep-51-test-fixtures/refresh_corpus.sh,
# which re-emits the SDK's SEP-0051 toJson output for every corpus fixture and
# diffs the entries against the committed corpus, whose reference JSON comes
# from the rs-stellar-xdr CLI oracle. Any drift means the SDK's emission no
# longer matches the reference implementation; the workflow fails and opens a
# tracking issue.
#
# Manual trigger only at commit time. Activation post-merge requires
# uncommenting the schedule block below in a separate explicit PR.
#
# schedule:
#   - cron: '0 8 * * MON'

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    name: SEP-51 reference-parity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, gmp, pcntl, sodium
          tools: composer:v2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Refresh corpus
        id: refresh
        run: |
          set +e
          bash tools/sep-51-test-fixtures/refresh_corpus.sh
          ec=$?
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open drift issue
        if: steps.refresh.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "SEP-51 corpus drift detected" \
            --label sep-51-corpus-drift \
            --body "Corpus drift detected vs the committed reference. Re-run \`tools/sep-51-test-fixtures/refresh_corpus.sh\` locally and update the corpus accordingly."

      - name: Halt on prerequisite failure
        if: steps.refresh.outputs.exit_code == '2'
        run: |
          echo "refresh_corpus.sh exit 2: prerequisite missing" >&2
          exit 1
